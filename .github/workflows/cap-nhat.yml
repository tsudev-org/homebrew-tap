name: cap-nhat
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: cap-nhat
jobs:
  cap-nhat:
    name: Cap nhat cask theo Release moi
    runs-on: macos-latest
    # Đẩy lên main bằng deploy key (secret BOT_DEPLOY_KEY của environment `bot`, CHỈ nhánh main dùng được) -
    # ngoại lệ DUY NHẤT của required check `Bảo vệ bản quyền` (ruleset bypass actor = DeployKey). Workflow
    # chạy từ nhánh PR không lấy được secret của environment này. Chưa có key ⇒ checkout dùng GITHUB_TOKEN
    # như cũ (giai đoạn chuyển tiếp). Thiết lập: tsudev docs/ban-quyen.md mục 6.
    environment: bot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ssh-key: ${{ secrets.BOT_DEPLOY_KEY }}
      - name: Cap nhat, cai thu, day len main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/cap-nhat.py
          if git diff --quiet Casks; then exit 0; fi
          brew tap-new --no-git tsudev-org/local-test
          tap="$(brew --repository)/Library/Taps/tsudev-org/homebrew-local-test"
          mkdir -p "$tap/Casks" && cp Casks/*.rb "$tap/Casks/"
          for f in $(git diff --name-only Casks); do
            c="$(basename "$f" .rb)"
            brew install --cask "tsudev-org/local-test/$c"
            brew uninstall --cask "tsudev-org/local-test/$c"
          done
          git config user.name 'tsudev-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/catalog.py
          git add Casks catalog.json
          git commit -m "chore(casks): cap nhat theo Release moi"
          git push
