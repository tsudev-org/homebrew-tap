name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cai-thu:
    name: Cai thu cask tren macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Gan tap tu ma nguon nay
        run: |
          brew tap-new --no-git tsudev-org/local-test
          tap="$(brew --repository)/Library/Taps/tsudev-org/homebrew-local-test"
          mkdir -p "$tap/Casks" && cp Casks/*.rb "$tap/Casks/"
      - name: Kiem cu phap, cai, chay, go
        run: |
          set -euo pipefail
          for f in Casks/*.rb; do
            c="$(basename "$f" .rb)"
            echo "== $c"
            brew style "$f"
            brew install --cask "tsudev-org/local-test/$c"
            brew uninstall --cask "tsudev-org/local-test/$c"
          done

  doi-ten:
    name: Doi ten cask (cask_renames.json) - may da cai ten cu tu chuyen
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Cai ten cu, nang cap, kiem ten moi
        run: |
          set -euo pipefail
          brew tap-new --no-git tsudev-org/rename-test
          tap="$(brew --repository)/Library/Taps/tsudev-org/homebrew-rename-test"
          mkdir -p "$tap/Casks"
          python3 - "$tap" <<'PY'
          import json, subprocess, sys
          tap = sys.argv[1]
          for old, new in json.load(open("cask_renames.json")).items():
              # Ban cuoi cung cua cask ten cu trong lich su repo (truoc khi doi ten).
              rev = subprocess.check_output(["git", "log", "-1", "--format=%H", "--", f"Casks/{old}.rb"], text=True).strip()
              src = subprocess.check_output(["git", "show", f"{rev}^:Casks/{old}.rb"], text=True)
              open(f"{tap}/Casks/{old}.rb", "w").write(src)
          PY
          for f in "$tap"/Casks/*.rb; do brew install --cask "tsudev-org/rename-test/$(basename "$f" .rb)"; done
          rm "$tap"/Casks/*.rb && cp Casks/*.rb "$tap/Casks/" && cp cask_renames.json "$tap/"
          brew upgrade --cask
          python3 -c 'import json; [print(o, n) for o, n in json.load(open("cask_renames.json")).items()]' | while read -r old new; do
            brew list --cask | tee /dev/stderr | grep -qx "$new" || { echo "LOI: $old chua chuyen sang $new"; exit 1; }
            brew list --cask | grep -qx "$old" && { echo "LOI: con $old"; exit 1; } || true
            brew uninstall --cask "tsudev-org/rename-test/$new"
          done
