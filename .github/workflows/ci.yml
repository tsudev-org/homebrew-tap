name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cai-thu:
    name: Cai thu cask tren macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Gan tap tu ma nguon nay
        run: |
          brew tap-new --no-git tsudev-org/local-test
          tap="$(brew --repository)/Library/Taps/tsudev-org/homebrew-local-test"
          mkdir -p "$tap/Casks" && cp Casks/*.rb "$tap/Casks/"
      - name: Kiem cu phap, cai, chay, go
        run: |
          set -euo pipefail
          for f in Casks/*.rb; do
            c="$(basename "$f" .rb)"
            echo "== $c"
            brew style "$f"
            brew install --cask "tsudev-org/local-test/$c"
            brew uninstall --cask "tsudev-org/local-test/$c"
          done
